name: android-compare

on:
  push:
    branches:
      - 'ci/android-compare'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build-neko-x64:
    name: Build NekoClash (android-x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build x86_64 APK
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          dart setup.dart android --arch amd64 --env stable -v
          ls -lh dist/

      - name: Upload NekoClash x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: neko-fixed-x86_64
          path: dist/*x86_64.apk

  connect-test:
    name: ${{ matrix.app_name }} Connection Test (Pixel 6 API 34)
    needs: [build-neko-x64]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: NekoClash
            source: artifact
            package: com.nekoclash
          - app_name: FlClash
            source: release
            repo: chen08209/FlClash
            pattern: 'FlClash-[0-9]*-android-amd64.apk'
            package: com.follow.clash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download NekoClash built APK
        if: matrix.source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: neko-fixed-x86_64
          path: /tmp/apks

      - name: Download FlClash release APK
        if: matrix.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apks
          gh release download --repo "${{ matrix.repo }}" --pattern "${{ matrix.pattern }}" --dir /tmp/apks

      - name: Normalize APK filename
        run: |
          mv /tmp/apks/*.apk /tmp/apks/app.apk
          ls -lh /tmp/apks/app.apk

      - name: Run zero-leak connection comparison on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: python3 .github/scripts/android_connect_compare.py --app-name ${{ matrix.app_name }} --apk /tmp/apks/app.apk --package ${{ matrix.package }} --out-dir connect-results

      - name: Upload app results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-${{ matrix.app_name }}
          path: connect-results
          if-no-files-found: ignore

  report:
    name: Merge Connection Report
    needs: [connect-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NekoClash results
        uses: actions/download-artifact@v4
        with:
          name: connect-NekoClash
          path: merged

      - name: Download FlClash results
        uses: actions/download-artifact@v4
        with:
          name: connect-FlClash
          path: merged

      - name: Generate side-by-side summary
        run: |
          python3 .github/scripts/android_connect_compare.py --merge merged/NekoClash.json merged/FlClash.json --out-dir merged
          cat merged/connect_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged results
        uses: actions/upload-artifact@v4
        with:
          name: android-connect-results
          path: merged
