name: android-compare

on:
  push:
    branches:
      - 'ci/android-compare'
  workflow_dispatch:

jobs:
  compare:
    name: NekoClash vs FlClash (Android Emulator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download latest release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apks
          gh release download --repo xikijinise/Nekoclash --pattern 'NekoClash-*-android-x86_64.apk' --dir /tmp/apks
          gh release download --repo chen08209/FlClash --pattern 'FlClash-[0-9]*-android-amd64.apk' --dir /tmp/apks
          mv /tmp/apks/NekoClash-*-android-x86_64.apk /tmp/apks/neko.apk
          mv /tmp/apks/FlClash-[0-9]*-android-amd64.apk /tmp/apks/flclash.apk
          ls -lh /tmp/apks

      - name: Run comparison on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: python3 .github/scripts/android_compare.py --neko-apk /tmp/apks/neko.apk --flclash-apk /tmp/apks/flclash.apk --out-dir compare-results

      - name: Publish step summary
        if: always()
        run: |
          if [ -f compare-results/summary.md ]; then
            cat compare-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-compare-results
          path: compare-results
          if-no-files-found: ignore
