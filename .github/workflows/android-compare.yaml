name: android-compare

on:
  push:
    branches:
      - 'ci/android-compare'
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.app_name }} (Pixel 6 API 34)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_name: NekoClash
            repo: xikijinise/Nekoclash
            pattern: 'NekoClash-*-android-x86_64.apk'
            package: com.nekoclash
          - app_name: FlClash
            repo: chen08209/FlClash
            pattern: 'FlClash-[0-9]*-android-amd64.apk'
            package: com.follow.clash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download latest release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/apks
          gh release download --repo "${{ matrix.repo }}" --pattern "${{ matrix.pattern }}" --dir /tmp/apks
          mv /tmp/apks/*.apk /tmp/apks/app.apk
          ls -lh /tmp/apks/app.apk

      - name: Run benchmark on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: python3 .github/scripts/android_compare.py --app-name ${{ matrix.app_name }} --apk /tmp/apks/app.apk --package ${{ matrix.package }} --out-dir compare-results

      - name: Upload app results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compare-${{ matrix.app_name }}
          path: compare-results
          if-no-files-found: ignore

  report:
    name: Merge Comparison Report
    needs: [benchmark]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NekoClash results
        uses: actions/download-artifact@v4
        with:
          name: compare-NekoClash
          path: merged

      - name: Download FlClash results
        uses: actions/download-artifact@v4
        with:
          name: compare-FlClash
          path: merged

      - name: Generate side-by-side summary
        run: |
          python3 .github/scripts/android_compare.py --merge merged/NekoClash.json merged/FlClash.json --out-dir merged
          cat merged/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged comparison
        uses: actions/upload-artifact@v4
        with:
          name: android-compare-results
          path: merged
